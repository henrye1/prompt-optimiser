<section class="page form-page">
  <a class="crumb" routerLink="/models">← Models</a>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <div class="model-form">
    <div class="model-form-head">
      <span class="tile tile-system">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2"/></svg>
      </span>
      <div>
        <div class="mf-title">Add a model</div>
        <div class="muted mf-sub">Connect a model by provider and key. Only you can see it.</div>
      </div>
    </div>

    <form (ngSubmit)="save()">
      <div class="model-form-body">
        <div class="form-field">
          <label class="form-label">Model name <span class="req">*</span></label>
          <input name="modelName" [(ngModel)]="name" placeholder="e.g. Gemini 2.0 Pro" autocomplete="off" autocapitalize="off" spellcheck="false" />
        </div>

        <div class="form-field">
          <label class="form-label">Provider <span class="req">*</span></label>
          <div class="provider-options">
            @for (p of providers(); track p.id) {
              <button
                type="button"
                class="provider-option"
                [class.selected]="providerId() === p.id"
                (click)="providerId.set(p.id)"
              >
                <span class="radio" [class.on]="providerId() === p.id"></span>
                <span class="provider-tile provider-{{ providerKey(p.name) }}">{{ initial(p.name) }}</span>
                <span class="provider-option-text">
                  <span class="po-name">{{ p.name }}</span>
                  @if (keyHint(p.name)) {
                    <span class="po-hint">{{ keyHint(p.name) }}</span>
                  }
                </span>
              </button>
            }
          </div>
        </div>

        <div class="form-field">
          <label class="form-label">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            API key <span class="req">*</span>
          </label>
          <div class="key-input-wrap">
            <input
              [type]="showKey() ? 'text' : 'password'"
              name="apiKey"
              [(ngModel)]="apiKey"
              placeholder="Your provider API key"
              autocomplete="new-password"
              autocapitalize="off"
              spellcheck="false"
            />
            <button class="key-eye" type="button" (click)="showKey.set(!showKey())" [title]="showKey() ? 'Hide' : 'Show'">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="form-hint">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            Stored securely on the server and only visible to you.
          </div>
        </div>
      </div>

      <div class="model-form-foot">
        <button class="ghost" type="button" routerLink="/models">Cancel</button>
        <button class="btn-primary" type="submit" [disabled]="!canSave() || saving()">
          + {{ saving() ? 'Adding…' : 'Add model' }}
        </button>
      </div>
    </form>
  </div>
</section>
